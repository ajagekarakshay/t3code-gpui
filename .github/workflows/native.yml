name: Native Rust

on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/backup/references/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang libclang-dev cmake pkg-config libssl-dev
          libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev
          libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev
          libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev
          libegl1-mesa-dev libvulkan-dev libasound2-dev libudev-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Environment and ACP tests
        run: cargo test -p t3-acp -p t3-connect -p t3-client -p t3-server --features t3-acp/test-support,t3-connect/test-support,t3-server/test-support --locked
      - name: Headless desktop interaction tests
        run: cargo test -p t3-desktop --locked
      - name: Lint
        run: cargo clippy -p t3-acp -p t3-connect -p t3-client -p t3-server -p t3-desktop --all-targets --features t3-acp/test-support,t3-connect/test-support,t3-server/test-support --locked -- -D warnings
      - name: Build native binaries
        run: cargo build -p t3-desktop -p t3-server --locked
